# Generate the Go gRPC server stubs for documents.v1 into ./gen.
#
# The documents.v1 contract lives in the shared buf.build/ogen-app/proto module
# (CON-220), not in this repo. `make proto` generates from a pinned version of
# that module; managed mode keeps the go_package_prefix below, so the generated
# import paths (github.com/ogen-app/document-service/gen/...) are stable. The
# stubs are committed so `go build` needs no buf.
version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/ogen-app/document-service/gen
plugins:
  - plugin: go
    out: gen
    opt: paths=source_relative
  - plugin: go-grpc
    out: gen
    opt: paths=source_relative

name: ci

# Run tests on every PR and push to main; build and publish the image to GHCR
# once tests pass, only on main (never on PRs / forks).
#
# Note: the documents.v1 contract lives in buf.build/ogen-app/proto (CON-220) and
# the generated stubs are committed under gen/, so builds/tests need no buf. A
# gen/-drift gate (mirroring pdf-service's `proto` job) can be added once
# documents.v1 is published to that module (`make proto` pins the module version).
on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default for GITHUB_TOKEN; jobs opt into more as needed.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go' | grep -v '^gen/'))"
          if [ -n "$unformatted" ]; then echo "needs gofmt:"; echo "$unformatted"; exit 1; fi

      # All application logging goes through log/slog (CON-107). Boot log.Fatal*
      # in cmd/documents-service is allowed; log.Print/Printf/Println are not.
      - name: forbid stdlib log.Print calls
        run: |
          if git grep -nE 'log\.Print(ln|f)?\(' -- cmd internal; then
            echo "::error::use log/slog, not the stdlib log.Print/Printf/Println functions"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # Pure Go — build the release binary exactly as the Dockerfile does.
      - name: build (CGO-free)
        run: CGO_ENABLED=0 go build ./...

      - name: test
        run: go test -race ./...

  # Every green main push publishes ghcr.io/ogen-app/document-service:<build>,
  # where build is the commit count on main, then asks ogen-release to bump
  # document-service to it.
  build-push:
    runs-on: ubuntu-latest
    # Gate the image on the tests: this job won't start until `test` succeeds.
    # Skip on PRs and on forks.
    needs: [test]
    if: github.event_name == 'push' && github.repository_owner == 'ogen-app'
    # Back-to-back merges publish one at a time, so build numbers reach the
    # registry and ogen-release in order. queue: max keeps every waiting run;
    # by default a newer one would cancel the run already waiting.
    concurrency:
      group: build-push
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: write # read/write the type=gha buildx layer cache
      packages: write # push the image to GHCR with GITHUB_TOKEN

    steps:
      # Full history: the build number is the commit count, which a shallow
      # clone reports as 1.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build number
        id: build
        run: echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The source label links the package to this repo, which is what lets
      # GITHUB_TOKEN push to it.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ogen-app/document-service:${{ steps.build.outputs.number }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/ogen-app/document-service
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Best effort: a missing ogen-release repo or token must not fail main.
      - name: Dispatch bump to ogen-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          BUILD: ${{ steps.build.outputs.number }}
        run: |
          gh api repos/ogen-app/ogen-release/dispatches \
            -f event_type=bump \
            -f 'client_payload[service]=document-service' \
            -F "client_payload[build]=$BUILD" \
            -f "client_payload[revision]=$GITHUB_SHA"
